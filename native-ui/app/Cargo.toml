[package]
name = "flit-exact-ui"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
accesskit = "=0.25.2"
accesskit_windows = { path = "../upstream/vendor/accesskit-windows" }
exact-kernel = { path = "../upstream/kernel" }
exact-painted = { path = "../upstream/host/painted" }
exact-runner = { path = "../upstream/runner" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
contract = { path = "../upstream/contract/cli" }

[patch.crates-io]
fontique = { path = "../upstream/vendor/fontique" }
parley = { path = "../upstream/vendor/parley" }
taffy = { path = "../upstream/vendor/taffy" }
wgpu-hal = { path = "../upstream/vendor/wgpu-hal" }

[profile.dev]
debug = 0


[profile.release]
opt-level = 2
strip = "debuginfo"
